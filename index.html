<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(
        to bottom,
        white 50%,
        #087de1 50%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: #222;
      font-size: 36px;
    }

    p {
      color: #333;
      font-size: 20px;
    }

    button {
      background-color: #16a34a;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #15803d;
    }

    #message {
      color: white;
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>I Love You ❤️</h1>
  <p>Will you be my best friend?</p>

  <button id="yesButton">Click If Yes 💚</button>

  <p id="message" aria-live="polite"></p>

  <script>
    document.getElementById("yesButton").addEventListener("click", function() {
      document.getElementById("message").textContent =
        "Awww! ❤️ You made me smile!";
    });
  </script>

</body>
</html>
